<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DCEAY</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box;margin:0}
:root{--bg:#EEF2FB;--sf:#fff;--sf2:#F3F6FC;--tx:#0F1729;--mu:#6B7488;--ac:#3B77F5;--mini:#1B1F29;--minitx:#fff;--minibtn:#fff;--minibtntx:#111;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151C;--sf:#1B1F29;--sf2:#232836;--tx:#fff;--mu:#8B93A7;--mini:#fff;--minitx:#111;--minibtn:#111;--minibtntx:#fff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151C;--sf:#1B1F29;--sf2:#232836;--tx:#fff;--mu:#8B93A7;--mini:#fff;--minitx:#111;--minibtn:#111;--minibtntx:#fff;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
button{font-family:inherit;cursor:pointer}
.app{position:relative;width:100%;max-width:430px;height:100%;overflow:hidden}
#view{height:100%;overflow-y:auto;padding:20px 20px 170px}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em}
h2{font-size:18px;font-weight:600;margin:26px 0 12px}
.sub{color:var(--mu)}
.note{background:var(--sf2);border-radius:16px;padding:12px 14px;color:var(--mu);font-size:13px;margin-top:18px}
.qa{display:flex;gap:10px;margin-top:20px}
.qa button{flex:1;background:var(--sf);border:0;border-radius:20px;padding:14px 4px;color:var(--tx);font-weight:600;font-size:12px;display:grid;gap:8px;justify-items:center}
.bub{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--ac) 15%,transparent);color:var(--ac)}
.card{background:var(--sf);border-radius:22px;padding:14px;display:flex;gap:12px;align-items:center;flex:1;border:0;color:var(--tx);text-align:left;font-size:15px}
.card b{display:block;font-weight:600}.card span{color:var(--mu);font-size:13px}
.two{display:flex;gap:12px}
.hs{display:flex;gap:14px;overflow-x:auto;margin:0 -20px;padding:0 20px}
.hc{flex:0 0 140px;cursor:pointer}.hc .art{width:140px;height:140px;border-radius:22px;margin-bottom:8px}
.hc b{display:block;font-weight:600;font-size:14px}.hc span{color:var(--mu);font-size:13px}
.art{background:radial-gradient(circle at 30% 25%,var(--b),transparent 62%),linear-gradient(145deg,var(--a),#0b1020)}
.art.s{width:48px;height:48px;border-radius:12px;flex:none}
.row{display:flex;align-items:center;gap:12px;padding:8px 0;cursor:pointer}
.row div{flex:1;min-width:0}
.row b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row span{color:var(--mu);font-size:13px}
.ic{background:none;border:0;color:inherit;font-size:20px;padding:6px;line-height:1}
.ic.liked{color:#EF4444}
.si{width:100%;background:var(--sf);border:0;border-radius:999px;padding:14px 18px;color:var(--tx);font:inherit;margin:16px 0 4px;outline-offset:2px}
.sg{display:flex;background:var(--sf2);border-radius:999px;padding:3px;margin:8px 0}
.sg button{flex:1;border:0;background:none;border-radius:999px;padding:9px;color:var(--mu);font-weight:600;font-size:13px}
.sg button.sel{background:var(--sf);color:var(--tx)}
.dots{display:flex;gap:12px;margin:10px 0}
.dots button{width:32px;height:32px;border-radius:50%;border:3px solid transparent;outline:2px solid transparent}
.dots button.sel{border-color:var(--bg);outline-color:var(--tx)}
.tg{display:flex;justify-content:space-between;align-items:center;background:var(--sf);border-radius:18px;padding:14px 16px;margin-bottom:10px}
.tg input{width:22px;height:22px;accent-color:var(--ac)}
#nav{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;background:#111;border-radius:999px;padding:6px;display:flex;gap:2px;z-index:3}
#nav button{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border:0;border-radius:999px;background:none;color:#9aa0ad;font-weight:600;font-size:14px}
#nav button{gap:0;transition:background-color .3s,color .3s,transform .18s cubic-bezier(.3,1.4,.5,1)}
#nav button span{max-width:0;margin-left:0;opacity:0;overflow:hidden;white-space:nowrap;transition:max-width .45s cubic-bezier(.2,.8,.2,1),margin .45s cubic-bezier(.2,.8,.2,1),opacity .3s}
#nav button.sel{background:#333;color:#fff}
#nav button.sel span{max-width:80px;margin-left:8px;opacity:1}
#mini{position:absolute;left:12px;right:12px;bottom:78px;background:var(--mini);color:var(--minitx);border-radius:26px;padding:8px 10px;display:flex;align-items:center;gap:10px;overflow:hidden;cursor:pointer;z-index:2}
#mini div{flex:1;min-width:0}
#mini b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini span{font-size:12px;opacity:.65}
#mbar{position:absolute;left:0;bottom:0;height:3px;background:var(--ac);width:0}
.pp{width:42px;height:42px;border-radius:50%;border:0;background:var(--minibtn);color:var(--minibtntx);display:grid;place-items:center;flex:none}
#np{position:absolute;inset:0;background:#10131a;color:#fff;transform:translateY(100%);transition:transform .6s cubic-bezier(.2,.9,.25,1);display:flex;flex-direction:column;padding:12px 24px 24px;z-index:5;isolation:isolate;overflow:hidden}
#np.open{transform:none}
.npbg{position:absolute;inset:-20%;z-index:-1;filter:blur(50px) saturate(1.3);opacity:.8}
#np header{display:flex;justify-content:space-between;align-items:center}
#np header>*{flex:1}
#np header .ic{flex:0 0 40px;color:#fff;text-align:left}
.seg{display:inline-flex;background:rgba(255,255,255,.14);border-radius:999px;padding:3px;flex:0 0 auto!important}
.seg button{border:0;background:none;color:#fff;opacity:.7;padding:7px 16px;border-radius:999px;font-weight:600;font-size:13px}
.seg button.sel{background:rgba(255,255,255,.22);opacity:1}
#pl{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px}
.big{width:min(100%,42vh);aspect-ratio:1;border-radius:28px;align-self:center;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.tt{display:flex;align-items:center;justify-content:space-between}
.tt b{display:block;font-size:24px;font-weight:700;letter-spacing:-.01em}
.tt span{opacity:.7}
.tm{display:flex;justify-content:space-between;font-size:12px;opacity:.7;margin-top:2px}
input[type=range]{width:100%;accent-color:#fff}
.ctl{display:flex;justify-content:center;align-items:center;gap:30px}
.ctl .ic{color:#fff}
.big-pp{width:72px;height:72px;border-radius:50%;border:0;background:#fff;color:#111;display:grid;place-items:center}
.opt{display:flex;justify-content:space-around}
.opt button{background:none;border:0;color:#fff;opacity:.55;font-weight:600;font-size:13px;padding:8px 14px}
.opt button.sel{opacity:1;color:#fff;text-decoration:underline;text-underline-offset:5px}
#ly{flex:1;overflow-y:auto;display:none;padding:18px 0 45vh}
.lbl{font-size:12px;opacity:.6;margin-bottom:16px}
.ln{font-size:25px;font-weight:700;line-height:1.25;opacity:.3;margin-bottom:18px;cursor:pointer;transform:scale(.92);transform-origin:left center;filter:blur(1.5px);transition:opacity .45s,transform .5s cubic-bezier(.2,.8,.2,1),filter .45s}
.ln.cur{opacity:1;transform:none;filter:none;text-shadow:0 0 24px color-mix(in srgb,var(--ac) 55%,transparent)}
.ln.pl{opacity:.85;cursor:default;transform:none;filter:none}
#toast{position:absolute;left:50%;top:16px;transform:translate(-50%,-90px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:999px;transition:transform .3s;z-index:9;font-size:13px;font-weight:600;white-space:nowrap}
#toast.show{transform:translate(-50%,0)}
@keyframes tabin{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes txtIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
#view{transition:transform .6s cubic-bezier(.2,.9,.25,1),opacity .6s,border-radius .6s}
#view.swap>*{animation:tabin .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--n,0)*45ms)}
.npo #view{transform:scale(.93);opacity:.45;border-radius:28px}
#mini{transition:transform .55s cubic-bezier(.2,.9,.25,1),opacity .35s}
.npo #mini{transform:translateY(130px);opacity:0}
#pl>:nth-child(2){--n:1}#pl>:nth-child(3){--n:2}#pl>:nth-child(4){--n:3}#pl>:nth-child(5){--n:4}
#np.open #pl>*{animation:txtIn .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--n,0)*60ms + .15s)}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:13px;margin-right:7px;vertical-align:-1px}
.eq i{width:3px;height:100%;background:var(--ac);border-radius:2px;transform-origin:bottom;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
.eq.pz i{animation-play-state:paused}
body,.sg,.tg,.si,.note{transition:background-color .4s,color .4s}
#nav,#mini{box-shadow:0 12px 32px rgba(10,16,40,.28)}
button{transition:transform .18s cubic-bezier(.3,1.4,.5,1)}
button:active{transform:scale(.93)}
html.rm *,html.rm *::before{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.pill{margin-top:12px;background:var(--ac);color:#fff;border:0;border-radius:999px;padding:13px 24px;font-weight:600;font-size:15px}
#mini{display:none}
#intro{position:absolute;inset:0;background:var(--bg);z-index:30;overflow:hidden;transition:opacity .6s}
#intro.done{opacity:0;pointer-events:none}
#splash,#onb{position:absolute;inset:0;transition:opacity .7s,transform .7s cubic-bezier(.2,.8,.2,1)}
#splash{display:grid;place-content:center;justify-items:center;gap:14px;background:linear-gradient(165deg,color-mix(in srgb,var(--ac) 24%,var(--bg)),var(--bg))}
.logo{width:96px;height:96px;border-radius:28px;background:#14182a;color:var(--ac);display:grid;place-items:center;box-shadow:0 20px 44px rgba(20,30,90,.35)}
#splash b{font-size:34px;letter-spacing:.05em}
#splash span{font-size:12px;letter-spacing:.16em;color:var(--mu)}
#onb{display:flex;flex-direction:column;padding:24px;opacity:0;transform:translateY(28px);pointer-events:none}
#intro.go #splash{opacity:0;transform:scale(1.08);pointer-events:none}
#intro.go #onb{opacity:1;transform:none;pointer-events:auto}
.pview{flex:1;overflow:hidden;display:flex}
.ptrack{display:flex;width:400%;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.pg{width:25%;display:flex;flex-direction:column;gap:12px;padding-right:2px}
.hero{flex:1;border-radius:32px;display:grid;place-items:center;color:#fff;margin-bottom:12px}
.pg h1{font-size:30px;line-height:1.15}
.pfoot{display:flex;justify-content:space-between;align-items:center;margin-top:20px}
.skip{background:none;border:0;color:var(--mu);font-weight:600;font-size:15px;padding:10px}
.dts{display:flex;gap:6px}
.dts i{width:8px;height:8px;border-radius:9px;background:var(--sf2);transition:width .35s,background .35s}
.dts i.on{width:22px;background:var(--ac)}
.arw{width:52px;height:52px;border-radius:50%;border:0;background:var(--ac);color:#fff;display:grid;place-items:center}
#gs{display:none;width:100%;margin-top:20px;padding:16px}
#onb.last .pfoot{display:none}
#onb.last #gs{display:block}
#nav{background:color-mix(in srgb,var(--sf) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:8px;gap:12px;align-items:center;box-shadow:0 14px 34px rgba(10,16,40,.2)}
#navp{display:flex;gap:2px;background:#1c1c1c;border-radius:999px;padding:5px;box-shadow:inset 0 0 0 2px #2c2c2c}
#navp button{height:44px;color:#b3b3b3}
#navp button.sel{background:#fff;color:#111}
#fab{width:56px;height:56px;border-radius:50%;border:0;background:#1c1c1c;color:#fff;display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.35),inset 0 0 0 2px #2c2c2c}
#fab .eq{margin:0;height:20px}
#fab .eq i{background:#fff}
#fab:not(.on) .eq{display:none}
#fab.on svg{display:none}
#mini{bottom:96px}
#view{padding-bottom:190px}
</style>
</head>
<body>
<div class="app">
  <main id="view"></main>
  <div id="mini" onclick="openNP()">
    <div class="art s" id="mart"></div>
    <div><b id="mt"></b><span id="ma"></span></div>
    <button class="ic" id="mh" aria-label="Like" onclick="event.stopPropagation();toggleLike(cur())"></button>
    <button class="pp" id="mp" aria-label="Play or pause" onclick="event.stopPropagation();toggle()"></button>
    <i id="mbar"></i>
  </div>
  <nav id="nav"></nav>
  <section id="np" aria-label="Now Playing">
    <div class="npbg" id="npbg"></div>
    <header>
      <button class="ic" aria-label="Close" onclick="closeNP()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="seg"><button id="sp" class="sel" onclick="setPane('player')">Player</button><button id="sl" onclick="setPane('lyrics')">Lyrics</button></div>
      <span></span>
    </header>
    <div id="pl">
      <div class="art big" id="nart"></div>
      <div class="tt"><div><b id="nt"></b><span id="na"></span></div><button class="ic" id="nh" aria-label="Like" style="color:#fff" onclick="toggleLike(cur())"></button></div>
      <div><input type="range" id="sk" min="0" step="0.25" value="0" aria-label="Seek" oninput="au.currentTime=+this.value"><div class="tm"><span id="te">0:00</span><span id="td">0:00</span></div></div>
      <div class="ctl">
        <button class="ic" aria-label="Previous" onclick="prev()"></button>
        <button class="big-pp" id="np2" aria-label="Play or pause" onclick="toggle()"></button>
        <button class="ic" aria-label="Next" onclick="next()"></button>
      </div>
      <div class="opt"><button id="bs" onclick="shuf=!shuf;paint()">Shuffle</button><button id="br" onclick="rep=!rep;paint()">Repeat</button></div>
    </div>
    <div id="ly"></div>
  </section>
  <div id="intro">
    <div id="splash"><div class="logo"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></div><b>DCEAY</b><span>ONE APP. ALL YOUR MUSIC.</span></div>
    <div id="onb"></div>
  </div>
  <div id="toast"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const ic=(d,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const fl=(d,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor">${d}</svg>`;
const PLAY='<path d="M8 5v14l11-7z"/>',PAUSE='<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
const AUD="https://api.audius.co/v1",APP="app_name=dceay";
let prefs={theme:"system",ac:"#3B77F5",dyn:true,rm:false,seen:false};
const L={trend:[],hist:[],fav:[],search:[],mine:[{id:"local-1",title:"BYE BYE Techno DEMO",artist:"Unknown artist",dur:122,art:"",src:"Techno_hard-1.mp3"}]},LYC={};
try{const s=JSON.parse(localStorage.getItem("dceay2")||"{}");Object.assign(prefs,s.prefs);L.fav=s.fav||[];L.hist=s.hist||[]}catch(e){}
const save=()=>{try{localStorage.setItem("dceay2",JSON.stringify({prefs,fav:L.fav,hist:L.hist}))}catch(e){}};
let tab="home",libTab="mine",q="",Q=[],i=0,shuf=false,rep=false,pane="player",lastCur=-2,tState="loading",sState="idle";
const au=new Audio();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cur=()=>Q[i];
const calm=()=>prefs.rm||matchMedia("(prefers-reduced-motion:reduce)").matches;
const anim=(e,kf,ms)=>{if(e&&!calm())e.animate(kf,{duration:ms,easing:"cubic-bezier(.2,.8,.2,1)"})};
const fmt=s=>{s=Math.floor(s||0);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h};
const norm=t=>({id:t.id,title:t.title||"Untitled",artist:(t.user&&t.user.name)||"Unknown artist",dur:t.duration||0,art:(t.artwork&&(t.artwork["480x480"]||t.artwork["150x150"]))||"",src:`${AUD}/tracks/${t.id}/stream?${APP}`});
const gx=t=>{const h=hue(t.title);return[`hsl(${h} 70% 52%)`,`hsl(${(h+50)%360} 80% 62%)`]};
const art=(t,c)=>{const[a,b]=gx(t);return `<div class="art ${c}" style="--a:${a};--b:${b};${t.art?`background:url('${t.art}') center/cover`:""}"></div>`};
function pa(e,t){const[a,b]=gx(t);e.style.setProperty("--a",a);e.style.setProperty("--b",b);e.style.background=t.art?`url("${t.art}") center/cover`:""}
const liked=t=>L.fav.some(x=>x.id===t.id);
const isCur=t=>cur()&&cur().id===t.id;
const EQ=()=>`<em class="eq${au.paused?" pz":""}"><i></i><i></i><i></i></em>`;
const row=(t,n,k)=>`<div class="row" onclick="play('${n}',${k})">${art(t,"s")}<div><b>${isCur(t)?EQ():""}${esc(t.title)}</b><span>${esc(t.artist)}</span></div><span>${t.dur?fmt(t.dur):""}</span><button class="ic ${liked(t)?"liked":""}" aria-label="Like" onclick="event.stopPropagation();toggleLike(L['${n}'][${k}])">${liked(t)?"♥":"♡"}</button></div>`;
const cards=n=>L[n].map((t,k)=>`<div class="hc" onclick="play('${n}',${k})">${art(t,"")}<b>${esc(t.title)}</b><span>${esc(t.artist)}</span></div>`).join("");
const rows=(n,empty)=>L[n].length?L[n].map((t,k)=>row(t,n,k)).join(""):`<p class="sub" style="margin-top:16px">${empty}</p>`;
function parseLRC(s){const o=[];(s||"").split("\n").forEach(l=>{const m=l.match(/^\[(\d+):(\d+(?:\.\d+)?)\](.*)$/);if(m)o.push({t:+m[1]*60+ +m[2],text:m[3].trim()})});return o.sort((a,b)=>a.t-b.t)}
function save2(){save()}
function applyPrefs(){const r=document.documentElement;prefs.theme==="system"?r.removeAttribute("data-theme"):r.setAttribute("data-theme",prefs.theme);r.style.setProperty("--ac",prefs.ac);r.classList.toggle("rm",prefs.rm);$("#npbg").style.opacity=prefs.dyn?.8:0}
function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove("show"),2400)}
const NAV=[["home","Home",'<path d="M5 10.5 12 4l7 6.5V18a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z"/><path d="M10 15h4"/>'],["search","Search",'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>'],["library","Library",'<path d="M3 8a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>'],["settings","Settings",'<path d="M12 3l7.8 4.5v9L12 21l-7.8-4.5v-9z"/><circle cx="12" cy="12" r="2.6"/>']];
const V={
home(){const h=new Date().getHours(),g=h<12?"morning":h<18?"afternoon":"evening";
return `<h1>Good ${g}</h1><p class="sub">What do you want to listen to?</p>
<h2>Speed dial</h2><div class="two"><button class="card" onclick="libTab='fav';go('library')"><i class="bub">♥</i><div><b>Liked Songs</b><span>${L.fav.length} songs</span></div></button><button class="card" onclick="L.trend.length?play('trend',0):toast('Trending is still loading')"><i class="bub">${fl(PLAY,18)}</i><div><b>Trending</b><span>Play the top song</span></div></button></div>
<h2>My songs</h2>${rows("mine","")}
${L.hist.length?`<h2>Recently played</h2><div class="hs">${cards("hist")}</div>`:""}
<h2>Trending on Audius</h2>${tState==="ok"?`<div class="hs">${cards("trend")}</div>`:tState==="err"?`<p class="sub">Can’t reach Audius. Check your connection.</p><button class="pill" onclick="loadTrend()">Try again</button>`:`<p class="sub">Loading trending songs…</p>`}`},
search(){return `<h1>Search</h1><input class="si" placeholder="Search songs and artists" value="${esc(q)}" oninput="onSearch(this.value)"><div id="res">${V.res()}</div>`},

settings(){const th=["system","light","dark"],cols=["#EF4444","#EC4899","#3B77F5","#22C55E","#F59E0B","#14B8A6","#8B5CF6"];
return `<h1>Settings</h1><h2>Theme</h2><div class="sg">${th.map(x=>`<button class="${prefs.theme===x?"sel":""}" onclick="prefs.theme='${x}';save();applyPrefs();render()">${x[0].toUpperCase()+x.slice(1)}</button>`).join("")}</div>
<h2>Accent color</h2><div class="dots">${cols.map(c=>`<button aria-label="Accent ${c}" class="${prefs.ac.toLowerCase()===c.toLowerCase()?"sel":""}" style="background:${c}" onclick="prefs.ac='${c}';save();applyPrefs();render()"></button>`).join("")}</div>
<h2>Now Playing</h2><label class="tg">Dynamic artwork background<input type="checkbox" ${prefs.dyn?"checked":""} onchange="prefs.dyn=this.checked;save();applyPrefs()"></label><label class="tg">Reduced motion<input type="checkbox" ${prefs.rm?"checked":""} onchange="prefs.rm=this.checked;save();applyPrefs()"></label>
<h2>About</h2><p class="sub">DCEAY 1.0.0. Music from Audius, lyrics from LRCLIB.</p>`}
};
function go(k){tab=k;render(1)}
function render(a){const v=$("#view");v.innerHTML=V[tab]();if(a){v.scrollTop=0;[...v.children].forEach((e,n)=>e.style.setProperty("--n",Math.min(n,8)));v.classList.remove("swap");void v.offsetWidth;v.classList.add("swap")}else v.classList.remove("swap");const n=$("#nav");if(!n.children.length)n.innerHTML=`<div id="navp">${NAV.map(([k,l,d])=>`<button aria-label="${l}" onclick="go('${k}')">${ic(d)}<span>${l}</span></button>`).join("")}</div><button id="fab" aria-label="Now Playing" onclick="cur()?openNP():toast('Play a song first')">${ic('<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',24)}<em class="eq"><i></i><i></i><i></i></em></button>`;[...$("#navp").children].forEach((b,x)=>b.classList.toggle("sel",NAV[x][0]===tab))}
function res(){const e=$("#res");if(e)e.innerHTML=V.res()}
function refresh(){tab==="search"?res():render()}
function loadTrend(){tState="loading";if(tab==="home")render();fetch(`${AUD}/tracks/trending?limit=15&${APP}`).then(r=>r.json()).then(j=>{L.trend=(j.data||[]).map(norm);tState=L.trend.length?"ok":"err"}).catch(()=>{tState="err"}).then(()=>{if(tab==="home")render()})}
function onSearch(v){q=v;clearTimeout(onSearch.h);if(!v.trim()){sState="idle";L.search=[];res();return}sState="loading";res();onSearch.h=setTimeout(()=>{const my=q;fetch(`${AUD}/tracks/search?query=${encodeURIComponent(my)}&limit=20&${APP}`).then(r=>r.json()).then(j=>{if(my!==q)return;L.search=(j.data||[]).map(norm);sState="ok";res()}).catch(()=>{if(my===q){sState="err";res()}})},350)}
function lyr(t){if(LYC[t.id])return;if(String(t.id).startsWith("local")){LYC[t.id]={s:"none",lines:[],plain:[]};return}const d=LYC[t.id]={s:"loading",lines:[],plain:[]},e=encodeURIComponent,u="https://lrclib.net/api/";
fetch(`${u}get?track_name=${e(t.title)}&artist_name=${e(t.artist)}&duration=${Math.round(t.dur)}`).then(r=>r.ok?r.json():Promise.reject()).catch(()=>fetch(`${u}search?q=${e(t.artist+" "+t.title)}`).then(r=>r.json()).then(a=>a.find(x=>x.syncedLyrics)||a[0])).then(x=>{
if(x&&x.syncedLyrics){d.lines=parseLRC(x.syncedLyrics);d.s=d.lines.length?"sync":"none"}else if(x&&x.plainLyrics){d.plain=x.plainLyrics.split("\n");d.s="plain"}else d.s="none"}).catch(()=>{d.s="none"}).then(()=>{if(cur()&&cur().id===t.id)drawLy()})}
function drawLy(){const t=cur(),d=t&&LYC[t.id];lastCur=-2;
$("#ly").innerHTML=!d||d.s==="loading"?`<p class="lbl">Looking for lyrics…</p>`:d.s==="sync"?`<p class="lbl">Synced lyrics</p>`+d.lines.map((l,k)=>`<p class="ln" data-i="${k}" onclick="au.currentTime=${l.t}">${esc(l.text)||"♪"}</p>`).join(""):d.s==="plain"?`<p class="lbl">Not synced</p>`+d.plain.map(l=>`<p class="ln pl">${esc(l)}</p>`).join(""):`<p class="lbl">No lyrics found for this song.</p>`;paint()}
function setTrack(){const t=cur();$("#mini").style.display="flex";
pa($("#mart"),t);pa($("#nart"),t);const h=hue(t.title);
$("#npbg").style.background=t.art?`url("${t.art}") center/cover`:`radial-gradient(circle at 25% 20%,hsl(${(h+50)%360} 80% 62%),transparent 60%),linear-gradient(160deg,hsl(${h} 70% 52%),#0b1020)`;
$("#mt").textContent=$("#nt").textContent=t.title;$("#ma").textContent=$("#na").textContent=t.artist;
lyr(t);drawLy();refresh();
anim($("#nart"),[{opacity:0,transform:"scale(.88) rotate(-2deg)"},{opacity:1,transform:"none"}],560);anim($(".tt"),[{opacity:0,transform:"translateY(10px)"},{opacity:1,transform:"none"}],420);anim($("#mart"),[{transform:"scale(.7)"},{transform:"none"}],360)}
function paint(){const t=cur();if(!t)return;const p=au.currentTime||0,d=(isFinite(au.duration)&&au.duration)||t.dur||0,pl=!au.paused;
document.querySelectorAll(".eq").forEach(e=>e.classList.toggle("pz",!pl));$("#fab").classList.toggle("on",pl);
$("#mp").innerHTML=fl(pl?PAUSE:PLAY,20);$("#np2").innerHTML=fl(pl?PAUSE:PLAY,30);

$("#sk").max=d;$("#sk").value=p;$("#te").textContent=fmt(p);$("#td").textContent=fmt(d);$("#mbar").style.width=(d?p/d*100:0)+"%";
$("#bs").classList.toggle("sel",shuf);$("#br").classList.toggle("sel",rep);
const D=LYC[t.id];let c=-1;if(D&&D.s==="sync")D.lines.forEach((l,k)=>{if(l.t<=p)c=k});
if(c!==lastCur){lastCur=c;document.querySelectorAll(".ln[data-i]").forEach(e=>e.classList.toggle("cur",+e.dataset.i===c));if(c>=0&&pane==="lyrics"){const e=document.querySelector(`.ln[data-i="${c}"]`);e&&e.scrollIntoView({block:"center",behavior:calm()?"auto":"smooth"})}}}
function load(){const t=cur();au.src=t.src;au.play().catch(()=>{});L.hist=[t,...L.hist.filter(x=>x.id!==t.id)].slice(0,12);save();setTrack()}
function play(n,k){Q=L[n].slice();i=k;load()}
function toggle(){if(!cur())return;au.paused?au.play().catch(()=>{}):au.pause();[$("#mp"),$("#np2")].forEach(e=>anim(e,[{transform:"scale(.8)"},{transform:"scale(1)"}],320))}
function next(auto){if(!Q.length)return;if(rep&&auto){au.currentTime=0;au.play()}else{i=shuf&&Q.length>1?(i+1+Math.floor(Math.random()*(Q.length-1)))%Q.length:(i+1)%Q.length;load()}}
function prev(){if(!Q.length)return;if(au.currentTime>3)au.currentTime=0;else{i=(i-1+Q.length)%Q.length;load()}}
function toggleLike(t){if(!t)return;const k=L.fav.findIndex(x=>x.id===t.id);k>=0?L.fav.splice(k,1):L.fav.unshift(t);save();paint();if(isCur(t))[$("#mh"),$("#nh")].forEach(e=>anim(e,[{transform:"scale(1)"},{transform:"scale(1.5)"},{transform:"scale(1)"}],400));refresh()}
function openNP(){$("#np").classList.add("open");document.querySelector(".app").classList.add("npo")}
function closeNP(){$("#np").classList.remove("open");document.querySelector(".app").classList.remove("npo")}

au.onplay=au.onpause=au.ontimeupdate=au.onloadedmetadata=paint;au.onended=()=>next(true);au.onerror=()=>{if(au.src)toast("Couldn’t play that song")};
const PG=[["Your music, all in one place","Search free music, keep your favorites, and play it all in one clean app.",'<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',"#3B77F5,#7B5CF0"],["Beautiful synchronized lyrics","Sing along with real-time lyrics, made to match your music perfectly.",'<path d="M4 7h16M4 12h10M4 17h14"/>',"#7B5CF0,#EC4899"],["Customize your experience","Choose your theme and accent color to make it truly yours.",'<circle cx="8" cy="9" r="1.5"/><circle cx="14" cy="7.5" r="1.5"/><circle cx="17" cy="12" r="1.5"/><path d="M12 3a9 9 0 1 0 0 18c1.5 0 2-1 1.5-2s0-2 1.5-2h2a4 4 0 0 0 4-4 9 9 0 0 0-9-10z"/>',"#14B8A6,#3B77F5"],["Ready to listen?","Let’s get started and bring your music to life.",'<path d="M8 5v14l11-7z"/>',"#F59E0B,#EF4444"]];

document.querySelectorAll("#np .ctl .ic")[0].innerHTML=fl('<path d="M6 5h2v14H6zM20 5v14L9 12z"/>');document.querySelectorAll("#np .ctl .ic")[1].innerHTML=fl('<path d="M16 5h2v14h-2zM4 5v14l11-7z"/>');
$("#mp").innerHTML=fl(PLAY,20);$("#np2").innerHTML=fl(PLAY,30);
