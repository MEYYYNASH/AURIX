name: Build and Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.3.2)'
        required: false
        default: 'v2.3.2'

permissions:
  contents: write

concurrency:
  group: aurix-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_ROOT" ] && [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            set +o pipefail
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Determine release tag
        run: |
          python3 - <<'PYEOF'
          import os, re, time

          with open("app/build.gradle.kts", "r", encoding="utf-8") as f:
            gradle_text = f.read()

          ver_m = re.search(r'versionName\s*=\s*"([^"]+)"', gradle_text)
          code_m = re.search(r'versionCode\s*=\s*(\d+)', gradle_text)
          date_m = re.search(r'buildConfigField\(\s*"String"\s*,\s*"RELEASE_DATE"\s*,\s*"\\"([^\\"]+)\\""\s*\)', gradle_text)

          version = (ver_m.group(1) if ver_m else "2.3.2").strip()
          vcode = code_m.group(1) if code_m else "20302"
          rdate = date_m.group(1) if date_m else time.strftime("%Y-%m-%d", time.gmtime())

          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          input_tag = os.environ.get("INPUT_TAG", "").strip()
          ref_type = os.environ.get("GITHUB_REF_TYPE", "")
          ref_name = os.environ.get("GITHUB_REF_NAME", "")

          if event_name == "workflow_dispatch" and input_tag:
            release_tag = input_tag
          elif ref_type == "tag" and ref_name:
            release_tag = ref_name
          else:
            slug = re.sub(r"\s+", "-", version.lower())
            release_tag = slug if slug.startswith("v") else f"v{slug}"

          build_ts_ms = int(time.time()) * 1000
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_f:
            env_f.write(f"RELEASE_TAG={release_tag}\n")
            env_f.write(f"RELEASE_VERSION={release_tag.lstrip('vV')}\n")
            env_f.write(f"RELEASE_VERSION_CODE={vcode}\n")
            env_f.write(f"RELEASE_DATE={rdate}\n")
            env_f.write(f"AURIX_BUILD_TIMESTAMP_MS={build_ts_ms}\n")
          PYEOF
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}

      - name: Ensure keystores exist
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f my-upload-key.jks ]; then
            keytool -genkey -v -keystore my-upload-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass android -keypass android -dname "CN=Aurix, OU=Music, O=Aurix, L=Unknown, ST=Unknown, C=US"
          fi

      - name: Build Release APK
        run: |
          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
        env:
          STORE_PASSWORD: android
          KEY_PASSWORD: android

      - name: Prepare versioned APK and version.json
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          test -f app/build/outputs/apk/release/output-metadata.json
          cp app/build/outputs/apk/release/app-release.apk "AURIX-${RELEASE_TAG}.apk"
          export APK_SHA256=$(sha256sum "AURIX-${RELEASE_TAG}.apk" | awk '{print $1}')
          printf "%s  AURIX-%s.apk\n" "$APK_SHA256" "$RELEASE_TAG" > "AURIX-${RELEASE_TAG}.apk.sha256"
          python3 - <<'PYEOF'
          import json, os
          tag = os.environ["RELEASE_TAG"]
          repo = os.environ["GITHUB_REPOSITORY"]
          data = {
            "versionName": os.environ["RELEASE_VERSION"],
            "versionCode": int(os.environ["RELEASE_VERSION_CODE"]),
            "releaseDate": os.environ["RELEASE_DATE"],
            "releaseTimestampMs": int(os.environ.get("AURIX_BUILD_TIMESTAMP_MS", "0") or 0),
            "apkUrl": f"https://github.com/{repo}/releases/download/{tag}/AURIX-{tag}.apk",
            "sha256": os.environ["APK_SHA256"],
            "mandatory": False,
            "notes": [
              f"Redesigned Animated Album Studio, Single-Download Fix & Material You Dynamic Theme ({tag}): Redesigned the Album screen and Library album cards with cover-harmonized palette accents, a peeking spinning vinyl disc, breathing aurora backdrop, sticky frosted top bar, and spring-animated controls; fixed single-song downloads so downloading 1 track saves directly to My songs without auto-creating an 'Unknown Album'; plus live Album-Art Material You theming via Palette API and cache-bypassing network JSON update checking",
              "Vinyl Widget Style, Resizable AURIX Now Playing Widget & Refreshed Settings (v2.3.1): Added the tactile 'Vinyl' style (cream paper #EFE6D6 & spinning half-visible vinyl disc) across classic widgets, introduced the resizable 'AURIX Now Playing' widget (3 sizes x 10 WCAG 4.5:1 styles with Material You Light/Paper theming), and refreshed Settings > Widgets",
              "5 Glass Widget Styles & Per-Widget Configurator (v2.3.0): Redesigned AURIX Music (4x2), AURIX Lyrics (4x2), AURIX Cover (2x2), and AURIX Mini (2x2) widgets with 5 distinct glass styles (Frost Pill, Orb, Smoked Neon, Light Frost, Poster Glass), automatic WCAG 4.5:1 cover-luminance contrast, independent per-widget style persistence by appWidgetId, instant setup & long-press Reconfigure picker with live previews and optional 'Apply to all widgets', plus real widget picker previews across Android 12–15+",
              "Redesigned Widgets, Real Picker Previews & Standby Overhaul (v2.2.0): Redesigned AURIX Music (4x2) and AURIX Lyrics (4x2) home screen widgets plus new AURIX Cover (2x2) and AURIX Mini (2x2) widgets with Glass, Color, and Mono styles in Settings, extracted ambient album glow, 24% rounded cover art, real static picker previews (Android 12–15+), and refreshed Standby Mode with Mint default mood and Split/Poster/Lyrics layouts",
              "Proportional Widget Lyrics & Reliable Release Verification (v2.1.6): Calibrated Home Screen Lyrics widget text sizes and launcher column widths for balanced 1:1 proportions across Small, Wide, and Large widgets (plus live preview); fixed OTA release APK SHA-256 verification against GitHub Release checksum assets",
              "Bundled Full-Unicode Khmer Fonts & Redesigned Glass Widgets (v2.1.5): Real full-Unicode Khmer & Latin .ttf fonts (Dangrek, Kantumruy Pro, Koulen, Noto Sans Khmer, Outfit, Inter) across app & widgets, fixed Khmer line-height clipping, and redesigned AURIX cosmic glass widgets"
            ],
            "releasePageUrl": f"https://github.com/{repo}/releases/tag/{tag}"
          }
          with open("version.json", "w", encoding="utf-8") as f:
            json.dump(data, f, indent=2)
            f.write("\n")
          PYEOF

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AURIX-${{ env.RELEASE_TAG }}-apk
          path: AURIX-${{ env.RELEASE_TAG }}.apk

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          RELEASE_FILES=(
            "app/build/outputs/apk/release/app-release.apk"
            "AURIX-${RELEASE_TAG}.apk"
            "AURIX-${RELEASE_TAG}.apk.sha256"
            "app/build/outputs/apk/release/output-metadata.json"
            "version.json"
          )

          for f in "${RELEASE_FILES[@]}"; do
            if [ ! -s "$f" ]; then
              echo "::error::Missing or empty release file: $f"
              exit 1
            fi
          done

          NOTES_FILE="${RUNNER_TEMP}/release_notes.md"
          cat > "$NOTES_FILE" <<EOF
          versionCode: ${RELEASE_VERSION_CODE}
          releaseTimestampMs: ${AURIX_BUILD_TIMESTAMP_MS}
          mandatory: false

          What's New in AURIX ${RELEASE_TAG}:
          - Redesigned Animated Album Studio & Single-Download Fix: Cover-harmonized Album screen & stacked Library album cards with a peeking spinning vinyl disc, breathing aurora glow, sticky frosted top bar, and spring animations; fixed single-song downloads so 1 track saves straight to My songs without auto-creating an 'Unknown Album'
          - Material You Dynamic Album Theme & Network Update Checker: Automatic album-art color extraction via Palette API driving full Light/Dark/AMOLED Material You UI theming with smooth color transitions, live palette swatches in Settings > Theme, and cache-bypassing remote JSON update checks with granular versioning & timestamped notifications
          - Vinyl Widget Style & Resizable AURIX Now Playing Widget (v2.3.1): Tactile cream-paper Vinyl style with half-visible 7s-turn spinning disc, new resizable AURIX Now Playing widget (Compact 4x1, Player 4x2, Lyrics 4x2+) with 10 WCAG 4.5:1 styles & Material You Light/Paper support, and redesigned Settings > Widgets studio
          - 5 Glass Widget Styles & Per-Widget Configurator (v2.3.0): Redesigned AURIX Music/Lyrics/Cover/Mini widgets with independent per-widget styles and instant setup/reconfigure picker
          EOF

          upload_assets_with_retry() {
            local attempt
            for attempt in 1 2 3; do
              if gh release upload "${RELEASE_TAG}" "${RELEASE_FILES[@]}" --repo "${GITHUB_REPOSITORY}" --clobber; then
                return 0
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Failed to upload assets to release ${RELEASE_TAG} after 3 attempts."
                return 1
              fi
              echo "::warning::Release asset upload attempt ${attempt} failed; retrying..."
              sleep $((attempt * 3))
            done
          }

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json id,isDraft,url >/dev/null 2>&1; then
            echo "Updating existing release ${RELEASE_TAG}..."
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" \
              -f "sha=${GITHUB_SHA}" -F force=true >/dev/null 2>&1 || \
              echo "::warning::Could not move tag ${RELEASE_TAG} to ${GITHUB_SHA}; continuing with release update."

            gh release edit "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --draft=false \
              --latest \
              --title "AURIX ${RELEASE_TAG}" \
              --notes-file "$NOTES_FILE"

            upload_assets_with_retry
          else
            echo "Creating new release ${RELEASE_TAG}..."
            if gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" \
                -f "sha=${GITHUB_SHA}" -F force=true >/dev/null 2>&1 || true
            fi

            if ! gh release create "${RELEASE_TAG}" "${RELEASE_FILES[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "AURIX ${RELEASE_TAG}" \
              --notes-file "$NOTES_FILE" \
              --latest; then
              echo "::warning::Initial release creation failed; checking if ${RELEASE_TAG} exists to update in-place..."
              gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null
              gh release edit "${RELEASE_TAG}" \
                --repo "${GITHUB_REPOSITORY}" \
                --draft=false \
                --latest \
                --title "AURIX ${RELEASE_TAG}" \
                --notes-file "$NOTES_FILE"
              upload_assets_with_retry
            fi
          fi

      - name: Sync version.json to default branch
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_type == 'branch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update version.json for ${RELEASE_TAG} [skip ci]"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }} || true
          fi

