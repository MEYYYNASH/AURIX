name: Build and Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.1.4)'
        required: false
        default: 'v2.1.4'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_ROOT" ] && [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            set +o pipefail
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Determine release tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            RELEASE_TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            RELEASE_TAG="${{ github.ref_name }}"
          else
            VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/' | tr '[:upper:]' '[:lower:]' | tr ' ' '-')
            RELEASE_TAG="v${VERSION:-2.1.4}"
          fi
          VCODE=$(grep -m1 'versionCode' app/build.gradle.kts | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          RDATE=$(grep -m1 'RELEASE_DATE' app/build.gradle.kts | sed -E 's/.*\\"([^\\"]+)\\".*/\1/')
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION_CODE=${VCODE:-20104}" >> "$GITHUB_ENV"
          echo "RELEASE_DATE=${RDATE:-$(date -u +%Y-%m-%d)}" >> "$GITHUB_ENV"

      - name: Ensure keystores exist
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f my-upload-key.jks ]; then
            keytool -genkey -v -keystore my-upload-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass android -keypass android -dname "CN=Aurix, OU=Music, O=Aurix, L=Unknown, ST=Unknown, C=US"
          fi

      - name: Build Release APK
        run: |
          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
        env:
          STORE_PASSWORD: android
          KEY_PASSWORD: android

      - name: Prepare versioned APK and version.json
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          test -f app/build/outputs/apk/release/output-metadata.json
          cp app/build/outputs/apk/release/app-release.apk "AURIX-${RELEASE_TAG}.apk"
          export APK_SHA256=$(sha256sum "AURIX-${RELEASE_TAG}.apk" | awk '{print $1}')
          python3 - <<'PYEOF'
          import json, os
          tag = os.environ["RELEASE_TAG"]
          repo = os.environ["GITHUB_REPOSITORY"]
          data = {
            "versionName": os.environ["RELEASE_VERSION"],
            "versionCode": int(os.environ["RELEASE_VERSION_CODE"]),
            "releaseDate": os.environ["RELEASE_DATE"],
            "apkUrl": f"https://github.com/{repo}/releases/download/{tag}/AURIX-{tag}.apk",
            "sha256": os.environ["APK_SHA256"],
            "mandatory": False,
            "notes": [
              f"Widget Photo Picker, Smooth Widget Animations & Clean Lyrics UI ({tag}): Fixed Photo Picker HEIC/AVIF & single-use gallery streams, fixed Home Screen Lyrics widget line animations with Binder-safe RGB_565 & Khmer bitmaps, removed floating overlay from Lyrics screen, and cleaned up the TAP Sync button styling",
              "Widget Customizer & Live Settings Preview (v2.0.3): Added Settings > Widgets > Customize widget with live 2:1 preview, 9 Frame styles, 5 Backgrounds, Blur & Darkness sliders, and fixed 2:1 Background Cropper",
              "Developer Mode & Offline Custom Lyrics Editor (v2.0.2): Tap Build number 7 times in Settings > About to unlock Developer mode with Write & TAP Sync editor, .lrc/.txt import/export, and Room offline priority over LRCLIB",
              "Lyrics Animation Picker & 5 Transition Styles (v2.0.1): Settings > Lyrics > Lyrics animation sheet with 5 looping live-preview cards and Both/App/Widget targeting"
            ],
            "releasePageUrl": f"https://github.com/{repo}/releases/tag/{tag}"
          }
          with open("version.json", "w", encoding="utf-8") as f:
            json.dump(data, f, indent=2)
            f.write("\n")
          PYEOF

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AURIX-${{ env.RELEASE_TAG }}-apk
          path: AURIX-${{ env.RELEASE_TAG }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: AURIX ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: true
          body: |
            versionCode: ${{ env.RELEASE_VERSION_CODE }}
            mandatory: false

            What's New in AURIX ${{ env.RELEASE_TAG }}:
            - Widget Photo Picker, Smooth Widget Animations & Clean Lyrics UI: Fixed Photo Picker HEIC/AVIF & single-use gallery streams, fixed Home Screen Lyrics widget line animations with Binder-safe RGB_565 & Khmer bitmaps, removed floating overlay from Lyrics screen, and cleaned up the TAP Sync button styling
            - Widget Customizer & Live Settings Preview (v2.0.3): Settings > Widgets > Customize widget with live 2:1 preview, 9 Frame styles, 5 Backgrounds, Blur & Darkness sliders, and fixed 2:1 Background Cropper
            - Developer Mode & Offline Custom Lyrics Editor (v2.0.2): Tap Build number 7 times in Settings > About for offline Write & TAP Sync custom lyrics
            - Lyrics Animation Picker & 5 Transition Styles (v2.0.1): 5 looping live-preview cards (Slide Up, Blur Fade, Karaoke Fill, Typewriter, Pop Zoom) and Both/App/Widget targeting
          files: |
            app/build/outputs/apk/release/app-release.apk
            AURIX-${{ env.RELEASE_TAG }}.apk
            app/build/outputs/apk/release/output-metadata.json
            version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync version.json to default branch
        if: github.event_name == 'push' && github.ref_type == 'branch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update version.json for ${RELEASE_TAG} [skip ci]"
            git push origin HEAD:${{ github.ref_name }} || true
          fi

