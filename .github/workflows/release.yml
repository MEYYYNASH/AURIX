name: Build and Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.7)'
        required: false
        default: 'v1.2.7'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Accept Android SDK licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Determine release tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            RELEASE_TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            RELEASE_TAG="${{ github.ref_name }}"
          else
            VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
            RELEASE_TAG="v${VERSION:-1.2.7}"
          fi
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"

      - name: Ensure release keystore exists
        run: |
          if [ ! -f my-upload-key.jks ]; then
            keytool -genkey -v -keystore my-upload-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass android -keypass android -dname "CN=Aurix, OU=Music, O=Aurix, L=Unknown, ST=Unknown, C=US"
          fi

      - name: Build Release APK
        run: gradle :app:assembleRelease
        env:
          STORE_PASSWORD: android
          KEY_PASSWORD: android

      - name: Prepare versioned APK
        run: cp app/build/outputs/apk/release/app-release.apk "AURIX-${RELEASE_TAG}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AURIX-${{ env.RELEASE_TAG }}-apk
          path: AURIX-${{ env.RELEASE_TAG }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: AURIX ${{ env.RELEASE_TAG }}
          body: |
            What's New in AURIX ${{ env.RELEASE_TAG }}:
            - Added frosted glass blur animations and expanding floating glass bottom navigation bar
            - Added Dynamic Artwork Background across screens and Now Playing with reduced motion toggle
            - Fixed status bar overlap on Sound Finder, Search, Library, and Settings screens
            - Added live playback progress ticker, working skip/shuffle/repeat/speed/sleep controls, and Settings redesign
          files: |
            app/build/outputs/apk/release/app-release.apk
            AURIX-${{ env.RELEASE_TAG }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
