name: Build and Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.0.0)'
        required: false
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_ROOT" ] && [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            set +o pipefail
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Determine release tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            RELEASE_TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            RELEASE_TAG="${{ github.ref_name }}"
          else
            VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/' | tr '[:upper:]' '[:lower:]' | tr ' ' '-')
            RELEASE_TAG="v${VERSION:-2.0.0}"
          fi
          VCODE=$(grep -m1 'versionCode' app/build.gradle.kts | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          RDATE=$(grep -m1 'RELEASE_DATE' app/build.gradle.kts | sed -E 's/.*\\"([^\\"]+)\\".*/\1/')
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION_CODE=${VCODE:-20000}" >> "$GITHUB_ENV"
          echo "RELEASE_DATE=${RDATE:-$(date -u +%Y-%m-%d)}" >> "$GITHUB_ENV"

      - name: Ensure keystores exist
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f my-upload-key.jks ]; then
            keytool -genkey -v -keystore my-upload-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass android -keypass android -dname "CN=Aurix, OU=Music, O=Aurix, L=Unknown, ST=Unknown, C=US"
          fi

      - name: Build Release APK
        run: |
          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
        env:
          STORE_PASSWORD: android
          KEY_PASSWORD: android

      - name: Prepare versioned APK and version.json
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          test -f app/build/outputs/apk/release/output-metadata.json
          cp app/build/outputs/apk/release/app-release.apk "AURIX-${RELEASE_TAG}.apk"
          export APK_SHA256=$(sha256sum "AURIX-${RELEASE_TAG}.apk" | awk '{print $1}')
          python3 - <<'PYEOF'
          import json, os
          tag = os.environ["RELEASE_TAG"]
          repo = os.environ["GITHUB_REPOSITORY"]
          data = {
            "versionName": os.environ["RELEASE_VERSION"],
            "versionCode": int(os.environ["RELEASE_VERSION_CODE"]),
            "releaseDate": os.environ["RELEASE_DATE"],
            "apkUrl": f"https://github.com/{repo}/releases/download/{tag}/AURIX-{tag}.apk",
            "sha256": os.environ["APK_SHA256"],
            "mandatory": False,
            "notes": [
              f"Smooth Animated Lyrics Widget ({tag}): Added native 60fps/120fps glide-up, fade, and subtle scale entrance animations whenever each synced lyric line transitions in the AURIX Lyrics home screen widget using flicker-free partial RemoteViews updates, beat-accurate 350ms LRC line detection (while keeping Music widget progress throttled to ~1s and zero polling when paused), and full Reduced Motion accessibility support",
              "Sculpted Frosted-Glass Widget Redesign (v1.9.9): Redesigned both Lyrics and Music home screen widgets with true-dp 24dp clipped glass corners (zero corner stretching), smart letterbox-free album art cropping and vibrant edge-to-edge centerCrop Ambient glow, crisp 1dp specular perimeter rim, glowing cyan-to-violet active lyric accent bar, sleek 3-bar waveform Lyrics pill + Orbi mark, mini rounded album art footer with bold Title · Artist styling, and precision-proportioned frosted glass control buttons",
              "Home Screen Music & Lyrics Widgets + Shared Ambient Album Glow (v1.9.8): Added 4×2 Music widget and 4×2 Synced Lyrics widget powered by pre-rendered cached Ambient Album Glow synced with Settings Dim (0–90%, default 40%), Glass level (0–100%, default 50%), and Blur level (0–100%, default 60%) plus EN/KM localization",
              "Library Recent Search History & Customizable Dynamic Artwork Background (v1.9.7): Added Library search bar with last-5 recent search history on tap/focus, plus custom Dim, Glass level (កម្រិតកញ្ចក់), and Blur level (កម្រិត Blur) controls with localized EN/KM Reset-to-Default confirmation dialog"
            ],
            "releasePageUrl": f"https://github.com/{repo}/releases/tag/{tag}"
          }
          with open("version.json", "w", encoding="utf-8") as f:
            json.dump(data, f, indent=2)
            f.write("\n")
          PYEOF

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AURIX-${{ env.RELEASE_TAG }}-apk
          path: AURIX-${{ env.RELEASE_TAG }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: AURIX ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: true
          body: |
            versionCode: ${{ env.RELEASE_VERSION_CODE }}
            mandatory: false

            What's New in AURIX ${{ env.RELEASE_TAG }}:
            - Smooth Animated Lyrics Widget: Native 60fps/120fps glide-up, fade, and subtle scale entrance animations whenever each synced lyric line changes in the AURIX Lyrics widget via flicker-free partial RemoteViews updates, beat-accurate 350ms LRC line detection (Music progress stays throttled at ~1s and stops on pause), and Reduced Motion support
            - Sculpted Frosted-Glass Widget Redesign (v1.9.9): True-dp 24dp clipped glass corners, smart letterbox-free album art cropping, vibrant edge-to-edge Ambient glow, crisp 1dp specular rim, glowing active lyric accent bar, 3-bar waveform Lyrics badge + Orbi mark, and mini rounded album cover footer
            - Home Screen Music & Lyrics Widgets + Shared Ambient Album Glow (v1.9.8): 4×2 Music and Synced Lyrics widgets powered by shared Settings Ambient glow (Dim 0–90% default 40%, Glass 0–100% default 50%, Blur 0–100% default 60%) and EN/KM localization
            - Library Recent Search History & Customizable Dynamic Artwork Background (v1.9.7): Library search bar with last-5 recent searches plus customizable Ambient glow sliders and Reset-to-Default confirmation dialog
          files: |
            app/build/outputs/apk/release/app-release.apk
            AURIX-${{ env.RELEASE_TAG }}.apk
            app/build/outputs/apk/release/output-metadata.json
            version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync version.json to default branch
        if: github.event_name == 'push' && github.ref_type == 'branch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update version.json for ${RELEASE_TAG} [skip ci]"
            git push origin HEAD:${{ github.ref_name }} || true
          fi

