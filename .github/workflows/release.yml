name: Build and Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.2.0)'
        required: false
        default: 'v2.2.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_ROOT" ] && [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            set +o pipefail
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Determine release tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            RELEASE_TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            RELEASE_TAG="${{ github.ref_name }}"
          else
            VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/' | tr '[:upper:]' '[:lower:]' | tr ' ' '-')
            RELEASE_TAG="v${VERSION:-2.2.0}"
          fi
          VCODE=$(grep -m1 'versionCode' app/build.gradle.kts | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          RDATE=$(grep -m1 'RELEASE_DATE' app/build.gradle.kts | sed -E 's/.*\\"([^\\"]+)\\".*/\1/')
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION_CODE=${VCODE:-20200}" >> "$GITHUB_ENV"
          echo "RELEASE_DATE=${RDATE:-$(date -u +%Y-%m-%d)}" >> "$GITHUB_ENV"

      - name: Ensure keystores exist
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f my-upload-key.jks ]; then
            keytool -genkey -v -keystore my-upload-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass android -keypass android -dname "CN=Aurix, OU=Music, O=Aurix, L=Unknown, ST=Unknown, C=US"
          fi

      - name: Build Release APK
        run: |
          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
        env:
          STORE_PASSWORD: android
          KEY_PASSWORD: android

      - name: Prepare versioned APK and version.json
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          test -f app/build/outputs/apk/release/output-metadata.json
          cp app/build/outputs/apk/release/app-release.apk "AURIX-${RELEASE_TAG}.apk"
          export APK_SHA256=$(sha256sum "AURIX-${RELEASE_TAG}.apk" | awk '{print $1}')
          printf "%s  AURIX-%s.apk\n" "$APK_SHA256" "$RELEASE_TAG" > "AURIX-${RELEASE_TAG}.apk.sha256"
          python3 - <<'PYEOF'
          import json, os
          tag = os.environ["RELEASE_TAG"]
          repo = os.environ["GITHUB_REPOSITORY"]
          data = {
            "versionName": os.environ["RELEASE_VERSION"],
            "versionCode": int(os.environ["RELEASE_VERSION_CODE"]),
            "releaseDate": os.environ["RELEASE_DATE"],
            "apkUrl": f"https://github.com/{repo}/releases/download/{tag}/AURIX-{tag}.apk",
            "sha256": os.environ["APK_SHA256"],
            "mandatory": False,
            "notes": [
              f"Redesigned Widgets, Real Picker Previews & Standby Overhaul ({tag}): Redesigned AURIX Music (4x2) and AURIX Lyrics (4x2) home screen widgets plus new AURIX Cover (2x2) and AURIX Mini (2x2) widgets with Glass, Color, and Mono styles in Settings, extracted ambient album glow, 24% rounded cover art, real static picker previews (Android 12–15+), and refreshed Standby Mode with Mint default mood and Split/Poster/Lyrics layouts",
              "Proportional Widget Lyrics & Reliable Release Verification (v2.1.6): Calibrated Home Screen Lyrics widget text sizes and launcher column widths for balanced 1:1 proportions across Small, Wide, and Large widgets (plus live preview); fixed OTA release APK SHA-256 verification against GitHub Release checksum assets",
              "Bundled Full-Unicode Khmer Fonts & Redesigned Glass Widgets (v2.1.5): Real full-Unicode Khmer & Latin .ttf fonts (Dangrek, Kantumruy Pro, Koulen, Noto Sans Khmer, Outfit, Inter) across app & widgets, fixed Khmer line-height clipping, and redesigned AURIX cosmic glass widgets",
              "Standby Bedside & Charging Screen + Clean Bilingual Update Error Handling (v2.1.4): 10 clock styles, 5 moods with Auto cover palette lerp, 3D Gyro Parallax, Khmer chips, burn-in drift & localized EN/KM 404 Retry error handling",
              "Khmer Lyrics Font Picker, Dangrek Titles & Restored Home Carousels (v2.1.3): Active-only lyric animation, Khmer font selector, and Dangrek titles"
            ],
            "releasePageUrl": f"https://github.com/{repo}/releases/tag/{tag}"
          }
          with open("version.json", "w", encoding="utf-8") as f:
            json.dump(data, f, indent=2)
            f.write("\n")
          PYEOF

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AURIX-${{ env.RELEASE_TAG }}-apk
          path: AURIX-${{ env.RELEASE_TAG }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: AURIX ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: true
          body: |
            versionCode: ${{ env.RELEASE_VERSION_CODE }}
            mandatory: false

            What's New in AURIX ${{ env.RELEASE_TAG }}:
            - Redesigned Widgets, Real Picker Previews & Standby Overhaul: Redesigned AURIX Music (4x2) and AURIX Lyrics (4x2) widgets plus new AURIX Cover (2x2) and AURIX Mini (2x2) widgets with Glass/Color/Mono styles, extracted ambient album glow, real widget picker previews, and Standby Split/Poster/Lyrics layouts with Mint default mood
            - Proportional Widget Lyrics & Reliable Release Verification (v2.1.6): Calibrated Home Screen Lyrics widget text sizes and real launcher column widths; fixed OTA release APK SHA-256 verification against GitHub Release checksum assets
            - Bundled Full-Unicode Khmer Fonts & Redesigned Glass Widgets (v2.1.5): Real full-Unicode Khmer & Latin .ttf fonts (Dangrek, Kantumruy Pro, Koulen, Noto Sans Khmer, Outfit, Inter) across app & widgets, fixed Khmer line-height clipping, and redesigned AURIX cosmic glass widgets
          files: |
            app/build/outputs/apk/release/app-release.apk
            AURIX-${{ env.RELEASE_TAG }}.apk
            AURIX-${{ env.RELEASE_TAG }}.apk.sha256
            app/build/outputs/apk/release/output-metadata.json
            version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync version.json to default branch
        if: github.event_name == 'push' && github.ref_type == 'branch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update version.json for ${RELEASE_TAG} [skip ci]"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }} || true
          fi

