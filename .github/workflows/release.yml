name: Build and Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.9.5)'
        required: false
        default: 'v1.9.5'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_ROOT" ] && [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            set +o pipefail
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Determine release tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            RELEASE_TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            RELEASE_TAG="${{ github.ref_name }}"
          else
            VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/' | tr '[:upper:]' '[:lower:]' | tr ' ' '-')
            RELEASE_TAG="v${VERSION:-1.9.5}"
          fi
          VCODE=$(grep -m1 'versionCode' app/build.gradle.kts | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          RDATE=$(grep -m1 'RELEASE_DATE' app/build.gradle.kts | sed -E 's/.*\\"([^\\"]+)\\".*/\1/')
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION_CODE=${VCODE:-10950}" >> "$GITHUB_ENV"
          echo "RELEASE_DATE=${RDATE:-$(date -u +%Y-%m-%d)}" >> "$GITHUB_ENV"

      - name: Ensure keystores exist
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f my-upload-key.jks ]; then
            keytool -genkey -v -keystore my-upload-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass android -keypass android -dname "CN=Aurix, OU=Music, O=Aurix, L=Unknown, ST=Unknown, C=US"
          fi

      - name: Build Release APK
        run: |
          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
        env:
          STORE_PASSWORD: android
          KEY_PASSWORD: android

      - name: Prepare versioned APK and version.json
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          test -f app/build/outputs/apk/release/output-metadata.json
          cp app/build/outputs/apk/release/app-release.apk "AURIX-${RELEASE_TAG}.apk"
          export APK_SHA256=$(sha256sum "AURIX-${RELEASE_TAG}.apk" | awk '{print $1}')
          python3 - <<'PYEOF'
          import json, os
          tag = os.environ["RELEASE_TAG"]
          repo = os.environ["GITHUB_REPOSITORY"]
          data = {
            "versionName": os.environ["RELEASE_VERSION"],
            "versionCode": int(os.environ["RELEASE_VERSION_CODE"]),
            "releaseDate": os.environ["RELEASE_DATE"],
            "apkUrl": f"https://github.com/{repo}/releases/download/{tag}/AURIX-{tag}.apk",
            "sha256": os.environ["APK_SHA256"],
            "mandatory": False,
            "notes": [
              f"Smooth Playlist Select Mode Open/Close & Tap Motion ({tag}): Added 420ms ease-out selection bar expansion, 600ms spring-overshoot selection circle roll-in (-120° to 0°), 46dp card glide with 35ms/20ms visible-row stagger, 300ms Select/Done button slide, #43C7F4 spring pop + 250ms white checkmark stroke draw, 2.5dp accent card outline, and 380ms delayed close clear",
              "Mini Inline Orbi Loading & Compact Sketch Skeletons: Scaled StatusRow / OrbiStatusRow down to a sleek 34dp mini planet with a glowing orbiting bead, 15sp bold shimmer text, 3dp bouncing dots, and compact 46dp frameless sketch track skeletons",
              "App Icon Picker & 5 Orbi Launcher Icons: Switch between Classic, Midnight, Ember, AMOLED, and Pearl Orbi adaptive launcher icons in Settings > Appearance > App icon with Android 13+ monochrome themed icon layers, 512x512 Play Store PNG exports, confirmation bottom sheet, and Happy Orbi celebration",
              "Orbi Mascot Animation System: Added OrbiView(state, size, runner) with white-lavender planet, -12° blinking/glancing eyes, -16° cyan-to-violet ring, glossy orbiting mini icons (Search, Music, Refresh, SyncUp, SyncDown), and interactive Orbi Animation Lab in Settings"
            ],
            "releasePageUrl": f"https://github.com/{repo}/releases/tag/{tag}"
          }
          with open("version.json", "w", encoding="utf-8") as f:
            json.dump(data, f, indent=2)
            f.write("\n")
          PYEOF

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AURIX-${{ env.RELEASE_TAG }}-apk
          path: AURIX-${{ env.RELEASE_TAG }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: AURIX ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: true
          body: |
            versionCode: ${{ env.RELEASE_VERSION_CODE }}
            mandatory: false

            What's New in AURIX ${{ env.RELEASE_TAG }}:
            - Smooth Playlist Select Mode Open/Close & Tap Motion: 420ms ease-out selection bar expansion, 600ms spring-overshoot selection circle roll-in (-120° to 0°), 46dp card glide with 35ms/20ms visible-row stagger, 300ms Select/Done button slide, #43C7F4 spring pop + 250ms white checkmark stroke draw, 2.5dp accent card outline, and 380ms delayed close clear
            - Mini Inline Orbi Loading & Compact Sketch Skeletons: Sleek 34dp mini planet with glowing orbiting bead, 15sp bold shimmer text, 3dp bouncing dots, and compact 46dp frameless sketch track skeletons
            - App Icon Picker & 5 Orbi Launcher Icons: Switch between Classic, Midnight, Ember, AMOLED, and Pearl Orbi adaptive launcher icons in Settings > Appearance > App icon with Android 13+ monochrome themed icon layers, 512x512 Play Store PNG exports, confirmation bottom sheet, and Happy Orbi celebration
            - Orbi Mascot Animation System: Added OrbiView(state, size, runner) with white-lavender planet, -12° blinking/glancing eyes, -16° cyan-to-violet ring, glossy orbiting mini icons (Search, Music, Refresh, SyncUp, SyncDown), and interactive Orbi Animation Lab in Settings
          files: |
            app/build/outputs/apk/release/app-release.apk
            AURIX-${{ env.RELEASE_TAG }}.apk
            app/build/outputs/apk/release/output-metadata.json
            version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync version.json to default branch
        if: github.event_name == 'push' && github.ref_type == 'branch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update version.json for ${RELEASE_TAG} [skip ci]"
            git push origin HEAD:${{ github.ref_name }} || true
          fi

