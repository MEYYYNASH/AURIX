<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 40 208 208" fill="none">
  <defs>
    <mask id="aurix-cutout" maskUnits="userSpaceOnUse">
      <rect x="40" y="40" width="208" height="208" fill="#FFFFFF" />
      <ellipse cx="136" cy="133" rx="7.5" ry="12" fill="#000000" />
      <ellipse cx="158" cy="130" rx="7.5" ry="12" fill="#000000" />
      <path
        d="M 228 144 A 84 26 0 0 1 60 144"
        transform="rotate(-12 144 144)"
        stroke="#000000"
        stroke-width="24"
        stroke-linecap="round"
        fill="none"
      />
    </mask>
  </defs>

  <!-- Back half (top arc) behind planet -->
  <path
    d="M 60 144 A 84 26 0 0 1 228 144"
    transform="rotate(-12 144 144)"
    stroke="#FFFFFF"
    stroke-width="10"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Planet circle with knocked-out eyes & front-ring gap -->
  <circle cx="144" cy="144" r="46" fill="#FFFFFF" mask="url(#aurix-cutout)" />

  <!-- Front half (bottom arc) over planet -->
  <path
    d="M 228 144 A 84 26 0 0 1 60 144"
    transform="rotate(-12 144 144)"
    stroke="#FFFFFF"
    stroke-width="10"
    stroke-linecap="round"
    fill="none"
  />
</svg>
